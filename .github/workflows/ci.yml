name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shelf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot and probe
        run: |
          docker run -d --name shelf -p 8080:8080 -e PASSWORD=ci shelf:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/healthz; then echo; break; fi
            sleep 1
          done
          curl -fs http://127.0.0.1:8080/healthz | grep -q '"ok":true'
          # Unauthenticated app page must redirect to /login; wrong password must be rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:8080' -d '{"password":"nope"}' http://127.0.0.1:8080/api/login)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:8080' -d '{"password":"ci"}' http://127.0.0.1:8080/api/login)" = "204"
          # Graceful shutdown: SIGTERM must exit 0 within the grace period
          docker stop -t 30 shelf
          test "$(docker inspect shelf --format '{{.State.ExitCode}}')" = "0"
          docker logs shelf | grep -qi 'stopped'
