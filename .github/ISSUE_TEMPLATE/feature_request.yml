name: Feature request
description: Suggest something for Shelf (please read the Non-goals first)
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Shelf is deliberately small and single-user. Accounts, sharing between people, folders, rich text, and public
        share links are explicit non-goals (see the README and `docs/SPEC.md`). Requests in that direction will likely
        be declined - a fork is the right home for them.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The concrete situation you hit, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps Shelf single-user and does not add accounts or per-user separation
        - label: This does not require a build step or a third runtime dependency
